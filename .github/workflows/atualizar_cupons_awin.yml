name: SOL GARIMPA - Cupons unificados a cada 30 minutos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_cupons_awin.py'
      - 'scripts/build_cupons_central.py'
      - 'docs/cupons/index.html'
      - '.github/workflows/atualizar_cupons_awin.yml'
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar-cupons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar API oficial de cupons Awin
        env:
          AWIN_PUBLISHER_TOKEN: ${{ secrets.AWIN_PUBLISHER_TOKEN }}
        run: python scripts/sync_cupons_awin.py

      - name: Consolidar cupons Awin Rakuten Lomadee
        run: python scripts/build_cupons_central.py

      - name: Salvar catalogo sem alterar as vitrines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cupons/ofertas.json docs/cupons/catalogo.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar catálogo de cupons Awin, Rakuten e Lomadee"
            bash scripts/git_push_retry.sh main
          else
            echo "Catalogo de cupons sem alteracoes"
          fi

      - name: Sincronizar arquivos para publicar site
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Preparar publicacao
        uses: actions/configure-pages@v5

      - name: Empacotar pagina de cupons
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
