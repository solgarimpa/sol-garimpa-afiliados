name: SOL GARIMPA - Sincronizar cupons Shopee (3 fontes)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_cupons_shopee.py'
      - 'docs/central/shopee.html'
      - '.github/workflows/atualizar_cupons_shopee.yml'
  schedule:
    - cron: '5,35 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar leitor de paginas publicas
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Consultar Pelando Cuponomia Meliuz e fonte atual
        run: python scripts/sync_cupons_shopee.py

      - name: Salvar dados e sincronizar branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/central/shopee-cupons.json
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizar cupons Shopee de fontes publicas"
            bash scripts/git_push_retry.sh main
          else
            echo "Nenhuma alteracao nos cupons"
          fi
          git fetch origin main
          git merge --ff-only origin/main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site inteiro
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
