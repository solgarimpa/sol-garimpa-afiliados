
name: Atualizar ofertas Lomadee SOL GARIMPA

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar-lomadee:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar ofertas oficiais Lomadee
        env:
          LOMADEE_API_TOKEN: ${{ secrets.LOMADEE_API_TOKEN }}
          LOMADEE_CHANNEL_ID: ${{ vars.LOMADEE_CHANNEL_ID }}
          LOMADEE_CHANNEL_NAME: Sol Garimpa
        run: python scripts/sync_lomadee.py

      - name: Salvar catalogo Lomadee
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lomadee/ofertas.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar catalogo Lomadee"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Catalogo sem alteracoes."
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar paginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
