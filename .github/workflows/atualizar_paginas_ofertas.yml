
name: SOL GARIMPA - Paginas de Ofertas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/ofertas.json'
      - 'docs/rakuten/ofertas.json'
      - 'docs/lomadee/ofertas.json'
      - 'scripts/build_paginas_ofertas.py'
      - '.github/workflows/atualizar_paginas_ofertas.yml'
  pull_request:
    paths:
      - 'scripts/build_paginas_ofertas.py'
      - 'tests/test_paginas_ofertas.py'
      - '.github/workflows/atualizar_paginas_ofertas.yml'
  schedule:
    - cron: '12 */3 * * *'

permissions:
  contents: read

concurrency:
  group: sol-garimpa-paginas-ofertas
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar catalogo
        run: python -m unittest discover -s tests -p 'test_paginas_ofertas.py' -v

  gerar:
    if: github.event_name != 'pull_request'
    needs: validar
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar catalogo
        run: python scripts/build_paginas_ofertas.py

      - name: Publicar catalogo
        run: |
          git config user.name 'sol-garimpa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/paginas_ofertas.json

          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza paginas de ofertas'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
