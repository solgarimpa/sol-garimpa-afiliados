name: SOL GARIMPA - Telegram (automatico)

on:
  # UTC; corresponde a 09h, 13h, 17h e 20h em Brasilia (UTC-3).
  schedule:
    - cron: '0 12,16,20,23 * * *'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar 1 oferta no canal? (false = apenas testar)'
        required: true
        type: boolean
        default: false
      rede:
        description: 'Qual rede publicar? (Automatica usa revezamento)'
        required: true
        type: choice
        options:
          - Automatica
          - Lomadee
          - Awin
          - Rakuten
        default: Automatica

permissions:
  contents: write

concurrency:
  group: sol-garimpa-postagem-telegram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler catalogos
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar codigo
        run: python -m py_compile scripts/postar_telegram.py

      - name: Testar envio de fotos e fallback (sem conexao externa)
        run: python -m unittest discover -s tests -p 'test_telegram_imagens.py' -v

      - name: Validar revezamento entre Awin Lomadee e Rakuten
        run: python -m unittest discover -s tests -p 'test_postar_telegram_redes.py' -v

      - name: Testar ou publicar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@solgarimpaofertas'
          PUBLICAR: ${{ github.event_name == 'schedule' || inputs.publicar == true }}
          REDE: ${{ inputs.rede || 'Automatica' }}
        run: |
          args=()
          if [ "$REDE" != "Automatica" ]; then
            args+=(--rede "$REDE")
          fi
          if [ "$PUBLICAR" = "true" ]; then
            python scripts/postar_telegram.py "${args[@]}"
          else
            python scripts/postar_telegram.py --dry-run "${args[@]}"
          fi

      - name: Registrar envio bem-sucedido
        if: ${{ github.event_name == 'schedule' || inputs.publicar == true }}
        run: |
          if [ ! -f docs/telegram/publicados.json ]; then
            echo "Nenhuma nova oferta foi publicada."
            exit 0
          fi
          git config user.name 'sol-garimpa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/telegram/publicados.json
          if ! git diff --cached --quiet; then
            git commit -m 'Registrar publicacao Telegram Sol Garimpa'
            bash scripts/git_push_retry.sh "${GITHUB_REF_NAME}"
          fi
