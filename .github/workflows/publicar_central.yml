name: SOL GARIMPA - Publicar Central no GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/central/**'
      - 'docs/.nojekyll'
      - '.github/workflows/publicar_central.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositorio atualizado
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar todos os arquivos de docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
