name: SOL GARIMPA - Testar Router Wix

on:
  pull_request:
    paths:
      - 'wix_router/**'
      - 'tests/test_router_wix.cjs'
      - '.github/workflows/testar_router_wix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_router_wix.cjs
