
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exclusivo das MELHORES LOJAS do Brasil pra vc! | SOL GARIMPA</title>
<style>
:root{color-scheme:light;--sol:#ffd12a;--ink:#1d1d1d;--sub:#656c78;--border:#e5e8ed;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:14px/1.36 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
main{max-width:1450px;margin:0 auto;padding:9px 10px 4px}
.head{display:flex;align-items:center;justify-content:center;text-align:center;min-height:58px;padding:4px 12px 5px}
h2{font-size:clamp(19px,3vw,26px);line-height:1.16;letter-spacing:-.5px;margin:3px 0;text-align:center}
.solar{background:var(--sol);color:#141414;padding:0 7px;border-radius:5px}
.eyebrow{text-align:center;font-size:11px;color:var(--sub)}
.filters-wrap{display:flex;align-items:center;gap:6px;margin:8px 0 5px;min-width:0}
.filterctl{border:1px solid #dedede;background:white;border-radius:9px;padding:6px 10px;font-weight:800}
.bar{display:flex;gap:6px;flex:1;min-width:0;overflow:auto;scrollbar-width:none;padding:2px 0}
.bar::-webkit-scrollbar,.viewport::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border:1px solid #e1e2e5;background:#fff;border-radius:24px;padding:7px 11px;font-size:11px;font-weight:750}
.pill[aria-pressed="true"]{background:#252525;color:#fff}
#feedback{font-size:11px;color:var(--sub);min-height:18px;margin-bottom:4px}
.viewport{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.rail{display:flex;gap:12px;padding:3px 2px 10px;min-width:min-content}
.card{display:flex;flex-direction:column;flex:0 0 268px;width:268px;overflow:hidden;background:white;border:1px solid var(--border);border-radius:14px;scroll-snap-align:start}
.image{height:180px;background:white;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.image img.product{object-fit:contain;max-width:96%;max-height:96%;width:auto;height:auto}
.imgtext{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:white}
.logo-stage{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:12px;background:white}
.logo-stage img{display:block;max-width:92%;max-height:84%;width:auto;height:auto;object-fit:contain}
.logo-chip{position:absolute;left:6px;top:6px;width:54px;height:37px;padding:3px;border:1px solid #eee;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
.logo-chip img{max-width:100%;max-height:100%;object-fit:contain}
.ribbon{position:absolute;right:7px;top:7px;background:#111;color:white;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:800}
.ribbon.discount{background:#248547}
.content{display:flex;flex-direction:column;gap:5px;flex:1;padding:9px 10px 10px}
.store{font-size:11px;font-weight:850;color:#56606d}
.name{font-size:13px;font-weight:850;line-height:1.25;min-height:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:18px;font-weight:950}
.old{font-size:10px;text-decoration:line-through;color:#777;margin-left:6px}
.code{align-self:flex-start;font-size:11px;font-weight:800;background:#fff2bc;border:1px dashed #c9a42a;border-radius:6px;padding:4px 8px}
.description{font-size:11px;color:#66717b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.act{flex:1;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;min-height:35px;padding:7px 6px;border-radius:9px;border:0;font-size:11px;font-weight:850}
.buy{background:var(--sol);color:#141414}
.share{background:#ecf8ef;color:#176538;border:1px solid #c9e8ce}
.inactive .buy{background:#eee;color:#666}
.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #eee;padding:10px 2px 3px;font-size:10px;color:#69717a}
.controls{display:flex;gap:6px}
.ctl{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:800}
.fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:white}
.fallback svg{width:55px;height:55px;opacity:.45}
@media(max-width:580px){h2{font-size:18px}.card{flex-basis:250px;width:250px}.image{height:164px}.footer{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
<header class="head">
<div>
<h2>Exclusivo das <span class="solar">MELHORES LOJAS</span> do Brasil pra vc!</h2>
<div class="eyebrow">Produtos, promoções e cupons publicados pelas lojas.</div>
</div>
</header>
<div class="filters-wrap">
<button class="filterctl" id="filtersPrev" aria-label="Lojas anteriores">‹</button>
<nav class="bar" id="filters"></nav>
<button class="filterctl" id="filtersNext" aria-label="Mais lojas">›</button>
</div>
<div id="feedback" aria-live="polite">Consultando ofertas...</div>
<div class="viewport" id="viewport">
<div class="rail" id="rail"></div>
</div>
<footer class="footer">
<span id="stamp">Preços sujeitos à confirmação nas lojas. Links de afiliado.</span>
<div class="controls">
<button class="ctl" id="prev">‹</button>
<button class="ctl" id="pause">Pausar</button>
<button class="ctl" id="next">›</button>
</div>
</footer>
</main>
<script>
(() => {
'use strict';
const SOURCE='https://solgarimpa.github.io/sol-garimpa-afiliados/ofertas.json';
const REFRESH=300000;
const AUTO=4500;
const STORES=[
'Afiliados Galícia Educação','Clovis Calçados BR','Earfun, Inc',
'Eotica BR','Eurorelogios BR','Farmácias Indiana BR',
'Fut Fanatics BR','Havaianas BR','Kabum BR','LG BR',
'Lego BR','Mizuno BR','Nike BR','Polishop BR',
'Posthaus BR',"Sam's Club BR",'Shark-Ninja BR',
'Soldiers Nutrition BR','Stanley BR','Technos BR',
'Tia Sônia BR','Under Armour BR'
];
const DOMAINS={
'Afiliados Galícia Educação':'galiciaeducacao.com.br',
'Clovis Calçados BR':'clovis.com.br',
'Earfun, Inc':'myearfun.com',
'Eotica BR':'eotica.com.br',
'Eurorelogios BR':'eurorelogios.com.br',
'Farmácias Indiana BR':'farmaciasindiana.com.br',
'Fut Fanatics BR':'futfanatics.com.br',
'Havaianas BR':'havaianas.com.br',
'Kabum BR':'kabum.com.br',
'LG BR':'lg.com',
'Lego BR':'lego.com',
'Mizuno BR':'mizuno.com.br',
'Nike BR':'nike.com.br',
'Polishop BR':'polishop.com.br',
'Posthaus BR':'posthaus.com.br',
"Sam's Club BR":'samsclub.com.br',
'Shark-Ninja BR':'br.sharkninja.com',
'Soldiers Nutrition BR':'soldiersnutrition.com.br',
'Stanley BR':'stanley1913.com.br',
'Technos BR':'technos.com.br',
'Tia Sônia BR':'tiasonia.com.br',
'Under Armour BR':'underarmour.com.br'
};
const VETORES={
'Nike BR':'nike','Lego BR':'lego','LG BR':'lg',
'Mizuno BR':'mizuno','Under Armour BR':'underarmour'
};
const $=id=>document.getElementById(id);
const rail=$('rail'),viewport=$('viewport'),filters=$('filters');
const node=(tag,cls='',text)=>{
const e=document.createElement(tag);
if(cls)e.className=cls;
if(text!==undefined)e.textContent=String(text);
return e;
};
const safe=value=>{
try{
const u=new URL(String(value||''));
return u.protocol==='https:'&&!u.username&&!u.password?u.href:'';
}catch{return '';}
};
const money=v=>new Intl.NumberFormat('pt-BR',{
style:'currency',currency:'BRL'
}).format(Number(v));
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="#5d6570" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M2 8 4 3h16l2 5M9 20v-7h6v7"/></svg>';
let all=[],visible=[],selected='Todas',paused=false,updated='';
function fallback(container,p){
const wrap=node('div','fallback');
wrap.innerHTML=icon;
container.append(wrap);
const slug=VETORES[p.loja];
if(slug){
const img=node('img');
img.alt='Logomarca '+p.loja;
img.onload=()=>{
if(img.naturalWidth>0&&wrap.isConnected)wrap.replaceChildren(img);
};
img.src='https://cdn.simpleicons.org/'+slug;
}
}
function validImage(url,minWidth,minHeight){
return new Promise(resolve=>{
if(!safe(url))return resolve(null);
const img=new Image();
img.decoding='async';
img.onload=()=>{
const w=img.naturalWidth,h=img.naturalHeight;
const vector=/\.svg(?:[?#]|$)/i.test(url);
if(vector||(w>=minWidth&&h>=minHeight)){
resolve(url);
}else resolve(null);
};
img.onerror=()=>resolve(null);
img.src=url;
});
}
function attachCover(container,p){
const version=p._imageVersion||0;
const isActive=p.tipo!=='sem_oferta'&&safe(p.link);
const domain=p.dominio_loja||DOMAINS[p.loja]||'';
const choices=[];
if(isActive&&safe(p.imagem)){
choices.push({url:p.imagem,w:145,h:110});
}
if(safe(p.logo_url)){
choices.push({url:p.logo_url,w:180,h:45});
}
if(domain&&/^[a-z0-9.-]+$/i.test(domain)){
choices.push({
url:'https://www.google.com/s2/favicons?domain='+encodeURIComponent(domain)+'&sz=256',
w:100,h:100
});
}
const slug=VETORES[p.loja];
if(slug)choices.push({url:'https://cdn.simpleicons.org/'+slug,w:1,h:1});
(async()=>{
for(const choice of choices){
const imageUrl=await validImage(choice.url,choice.w,choice.h);
if(!imageUrl||!container.isConnected)returnIfAbsent();
if(imageUrl){
const img=node('img',isActive&&choice.url===p.imagem?'product':'');
img.alt=isActive&&choice.url===p.imagem?p.titulo:'Logomarca '+p.loja;
img.src=imageUrl;
img.style.maxWidth='92%';
img.style.maxHeight='84%';
img.style.objectFit='contain';
container.append(img);
return;
}
}
if(container.isConnected)fallback(container,p);
})();
function returnIfAbsent(){return null;}
}
function card(p){
const inactive=p.tipo==='sem_oferta'||!safe(p.link);
const box=node('article','card'+(inactive?' inactive':''));
const image=node('div','image');
attachCover(image,p);
if(!inactive){
const badge=p.desconto_pct>=5?p.desconto_pct+'% OFF':
p.tipo==='cupom'?'Cupom':'Promoção';
image.append(node('span','ribbon'+(p.desconto_pct>=5?' discount':''),badge));
}
box.append(image);
const body=node('div','content');
body.append(node('div','store',p.loja),node('div','name',p.titulo));
if(!inactive&&Number(p.preco)>0){
const price=node('div','price',money(p.preco));
if(Number(p.preco_anterior)>Number(p.preco)){
price.append(node('span','old',money(p.preco_anterior)));
}
body.append(price);
}else if(!inactive){
body.append(node('div','description','Confira o preço atualizado na loja.'));
}
if(!inactive&&p.cupom)body.append(node('span','code','Cupom: '+p.cupom));
if(!inactive&&p.descricao)body.append(node('div','description',p.descricao));
const actions=node('div','actions');
if(inactive){
actions.append(node('span','act buy','Sem oferta ativa'));
}else{
const go=node('a','act buy','Ver oferta ↗');
go.href=safe(p.url_sol_garimpa||p.link);
go.target='_blank';
go.rel='sponsored noopener noreferrer';
const wa=node('a','act share','WhatsApp');
const msg=[
'🛍️ OFERTA SOL GARIMPA',
p.loja,p.titulo,
p.preco>0?'💰 '+money(p.preco):'',
p.cupom?'🎟️ Cupom: '+p.cupom:'',
'👉 '+(p.url_sol_garimpa||p.link)
].filter(Boolean).join('\n');
wa.href='https://wa.me/?text='+encodeURIComponent(msg);
wa.target='_blank';
wa.rel='noopener noreferrer';
actions.append(go,wa);
}
body.append(actions);
box.append(body);
return box;
}
function display(){
visible=all.filter(p=>selected==='Todas'?
p.tipo!=='sem_oferta':p.loja===selected);
rail.replaceChildren(...visible.map(card));
viewport.scrollLeft=0;
$('feedback').textContent=
visible.filter(p=>p.tipo!=='sem_oferta').length+
' ofertas encontradas • '+
new Set(visible.filter(p=>p.tipo!=='sem_oferta').map(p=>p.loja)).size+
' lojas com ofertas disponíveis';
$('prev').disabled=$('next').disabled=visible.length<2;
}
function showFilters(){
filters.replaceChildren();
for(const name of ['Todas',...STORES]){
const button=node('button','pill',name);
button.setAttribute('aria-pressed',String(name===selected));
button.onclick=()=>{
selected=name;showFilters();display();
};
filters.append(button);
}
}
function move(delta){
const first=rail.querySelector('.card');
if(!first)return;
const step=first.getBoundingClientRect().width+12;
const max=viewport.scrollWidth-viewport.clientWidth;
let next=viewport.scrollLeft+step*delta;
if(next>max+5)next=0;
if(next<0)next=max;
viewport.scrollTo({left:next,behavior:'smooth'});
}
$('filtersPrev').onclick=()=>filters.scrollBy({left:-220,behavior:'smooth'});
$('filtersNext').onclick=()=>filters.scrollBy({left:220,behavior:'smooth'});
$('prev').onclick=()=>move(-1);
$('next').onclick=()=>move(1);
$('pause').onclick=()=>{
paused=!paused;
$('pause').textContent=paused?'Continuar':'Pausar';
};
setInterval(()=>{
if(!paused&&!document.hidden&&!viewport.matches(':hover'))move(1);
},AUTO);
async function refresh(){
try{
const response=await fetch(SOURCE+'?v='+Date.now(),{cache:'no-store'});
if(!response.ok)throw Error('HTTP '+response.status);
const data=await response.json();
if(!Array.isArray(data.cards))throw Error('Catálogo inválido');
const date=Date.parse(data.atualizado_em);
if(!Number.isFinite(date)||Date.now()-date>48*3600000)
throw Error('Catálogo desatualizado');
if(updated===data.atualizado_em)return;
updated=data.atualizado_em;
all=data.cards.filter(p=>p&&STORES.includes(p.loja)&&
['produto','promocao','cupom','sem_oferta'].includes(p.tipo)&&
(p.tipo==='sem_oferta'||safe(p.link)));
for(const name of STORES){
if(!all.some(p=>p.loja===name)){
all.push({loja:name,tipo:'sem_oferta',
titulo:'Nenhuma oferta vigente encontrada'});
}
}
showFilters();
display();
$('stamp').textContent='Atualizado em '+
new Date(date).toLocaleString('pt-BR',{
timeZone:'America/Sao_Paulo'
})+' • Preços sujeitos à confirmação • Links de afiliado';
}catch(e){
$('feedback').textContent='Ofertas temporariamente indisponíveis.';
console.warn('Awin:',e.message);
}
}
showFilters();
refresh();
setInterval(refresh,REFRESH);
})();
</script>
</body>
</html>
