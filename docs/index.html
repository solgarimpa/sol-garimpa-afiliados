<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOL GARIMPA | Ofertas dos 22 parceiros Awin</title>
<style>
:root{color-scheme:light;--sol:#fdd329;--ink:#1d1d1d;--sub:#69717a;--border:#e5e8eb;--white:#fff;--bg:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1450px;margin:auto;padding:18px 12px 12px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-size:clamp(20px,4vw,29px);margin:0;letter-spacing:-.6px;line-height:1.1}.solar{background:linear-gradient(transparent 55%,#ffdd54 55%)}
.kicker{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.eyebrow{color:var(--sub);font-size:12px;margin-top:7px}
.brandtag{background:var(--ink);border-radius:60px;padding:7px 11px;color:var(--sol);font-size:10px;font-weight:900;letter-spacing:1px;white-space:nowrap}
.bar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:15px 0 13px}.bar::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;cursor:pointer;border-radius:40px;padding:8px 12px;border:1px solid var(--border);background:white;color:#333;font-size:12px;font-weight:750}
.pill[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
#feedback{color:#515861;font-size:12px;min-height:20px;padding:0 1px 8px}
.viewport{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;padding-bottom:6px;touch-action:pan-x pan-y}
.viewport::-webkit-scrollbar{display:none}.rail{display:flex;gap:12px;padding:3px 2px 10px;min-width:min-content}
.card{position:relative;border:1px solid var(--border);border-radius:17px;width:clamp(238px,80vw,312px);background:#fff;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.045);scroll-snap-align:start;display:flex;flex-direction:column}
.image{height:211px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg)}
.image img{width:100%;height:100%;object-fit:contain;background:white;padding:10px}.imgtext{background:radial-gradient(circle at 83% 20%,#fffacb 0 12%,transparent 35%),linear-gradient(150deg,#ffcc00,#ffed99);height:100%;width:100%;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.imgtext .mark{font-weight:900;letter-spacing:-2px;font-size:52px;color:#111;line-height:1}.imgtext .word{font-weight:950;font-size:clamp(18px,6vw,29px);line-height:1.1;overflow-wrap:anywhere;max-width:95%;padding:5px}.imgtext .kind{font-size:10px;letter-spacing:1.4px;font-weight:900;text-transform:uppercase}
.ribbon{position:absolute;top:10px;left:10px;font-size:11px;background:#111;color:#fff;padding:5px 8px;border-radius:8px;font-weight:800;max-width:80%}.ribbon.discount{background:#248547}
.content{padding:13px;display:flex;flex:1;flex-direction:column;gap:7px}.store{color:#5d6470;font-size:12px;font-weight:800}.name{font-size:16px;font-weight:820;letter-spacing:-.3px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.price{font-size:21px;font-weight:900;margin-top:1px;letter-spacing:-.5px}.old{color:var(--sub);font-size:12px;text-decoration:line-through;font-weight:500;margin-left:6px}
.code{align-self:flex-start;background:#fff3c2;border:1px dashed #c49b0f;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:800}
.description{font-size:12px;color:#67717d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:7px;margin-top:auto;padding-top:7px}.act{flex:1;cursor:pointer;text-align:center;border:none;text-decoration:none;padding:11px 8px;border-radius:10px;font-weight:850;font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px}
.buy{background:var(--sol);color:#171717}.share{background:#eff9f1;color:#14642c;border:1px solid #c6e9ca}.act:focus-visible,.pill:focus-visible,button:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
.inactive .image{filter:grayscale(.3)}.inactive .buy{background:#ececec;color:#667;cursor:default}.empty{padding:35px 20px;border:1px dashed #ddd;border-radius:12px;text-align:center;color:#555;max-width:560px}
.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid #eee;padding:10px 2px 3px;font-size:11px;color:#69717a}.controls{display:flex;gap:7px;align-items:center}.ctl{cursor:pointer;border:1px solid #dedede;background:white;border-radius:9px;padding:7px 10px;color:#333;font-size:12px;font-weight:800}.ctl:disabled{opacity:.5;cursor:default}
@media(min-width:920px){main{padding:18px}.card{width:306px}.image{height:220px}}
@media(prefers-reduced-motion:reduce){.viewport{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <header class="head"><div><div class="kicker">Ofertas de lojas parceiras</div><h2>Garimpos da <span class="solar">Awin</span> pra você!</h2><div class="eyebrow">Produtos, promoções e cupons publicados pelos anunciantes</div></div><div class="brandtag">SOL GARIMPA ✦</div></header>
  <nav class="bar" id="filters" aria-label="Filtrar lojas"></nav>
  <div id="feedback" role="status" aria-live="polite">Carregando informações…</div>
  <div id="viewport" class="viewport" tabindex="0" aria-label="Carrossel de ofertas. Deslize para ver mais."><div id="rail" class="rail"></div></div>
  <footer class="footer"><span id="stamp">Informações sujeitas à confirmação na loja. Links de afiliado.</span><div class="controls"><button class="ctl" type="button" id="prev" aria-label="Anterior">‹</button><button class="ctl" type="button" id="pause">Pausar</button><button class="ctl" type="button" id="next" aria-label="Próximo">›</button><button class="ctl" type="button" id="copy">Copiar mensagens</button></div></footer>
</main>
<script>
(() => {
'use strict';
// OPÇÃO A — cole a URL HTTPS de docs/ofertas.json, disponibilizada pelo GitHub Pages.
// OPÇÃO B — mantenha vazio para receber os mesmos dados por postMessage do código Wix Velo.
const PUBLIC_JSON_URL = './ofertas.json';
const STORES = ['Afiliados Galícia Educação','Clovis Calçados BR','Earfun, Inc','Eotica BR','Eurorelogios BR','Farmácias Indiana BR','Fut Fanatics BR','Havaianas BR','Kabum BR','LG BR','Lego BR','Mizuno BR','Nike BR','Polishop BR','Posthaus BR',"Sam's Club BR",'Shark-Ninja BR','Soldiers Nutrition BR','Stanley BR','Technos BR','Tia Sônia BR','Under Armour BR'];
const $ = id => document.getElementById(id), rail=$('rail'), view=$('viewport'), filters=$('filters'), feedback=$('feedback');
const safe = value => {try{const u=new URL(String(value||''));return u.protocol==='https:' ? u.href : '';}catch(_){return '';}};
const brl = num => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(num));
const timestamp = value => {const d=new Date(value); return isNaN(d.getTime()) ? null : d;};
const fmtdate = value => {const d=timestamp(value);return d?d.toLocaleDateString('pt-BR',{timeZone:'UTC'}):'';};
let all=[], visible=[], selected='Todas', offset=0, paused=matchMedia('(prefers-reduced-motion: reduce)').matches, loaded=false;
const el=(tag,cls,content)=>{let d=document.createElement(tag);if(cls)d.className=cls;if(content!==undefined)d.textContent=content;return d;};
function message(p){
  if(!p||!safe(p.link)||p.tipo==='sem_oferta') return '';
  const a=['🛍️ *OFERTA SOL GARIMPA*',`🏬 *${p.loja}*`, `✨ ${p.titulo}`];
  if(p.preco!=null){let value=`💰 *${brl(p.preco)}*`;if(p.preco_anterior&&p.preco_anterior>p.preco)value+=` (antes ${brl(p.preco_anterior)})`;a.push(value);}
  if(p.cupom)a.push(`🎟️ Cupom: *${p.cupom}*`);
  if(p.validade)a.push(`🗓️ Validade informada: ${fmtdate(p.validade)}`);
  if(p.descricao)a.push(p.descricao.slice(0,200));
  if(p.termos)a.push(`ℹ️ Condições: ${p.termos.slice(0,240)}`);
  a.push(`👉 Confira na SOL GARIMPA: ${p.url_sol_garimpa||p.link}`,'⚠️ Preço e disponibilidade sujeitos à confirmação na loja.','Publicidade • Link de afiliado SOL GARIMPA');
  return a.filter(Boolean).join('\n');
}
function card(p){
 const inactive=p.tipo==='sem_oferta'||!safe(p.link);
 const box=el('article','card'+(inactive?' inactive':''));const image=el('div','image');
 if(p.imagem&&safe(p.imagem)&&!inactive){const pic=el('img');pic.src=p.imagem;pic.alt=p.titulo||'Produto';pic.loading='lazy';pic.decoding='async';pic.onerror=()=>{pic.remove();image.appendChild(art(p));};image.appendChild(pic);}else image.appendChild(art(p));
 if(!inactive){const badge=el('div','ribbon'+(p.desconto_pct>=5?' discount':''),p.desconto_pct>=5?`${p.desconto_pct}% OFF`:p.tipo==='cupom'?'Cupom Awin':p.tipo==='produto'?'Produto afiliado':'Promoção Awin');image.appendChild(badge);}
 box.appendChild(image);const content=el('div','content');content.appendChild(el('div','store',p.loja));content.appendChild(el('div','name',p.titulo));
 if(!inactive&&p.preco!=null){const price=el('div','price',brl(p.preco));if(p.preco_anterior&&p.preco_anterior>p.preco)price.appendChild(el('span','old',brl(p.preco_anterior)));content.appendChild(price);}
 if(p.cupom&&!inactive)content.appendChild(el('div','code',`Cupom: ${p.cupom}`));
 if(p.descricao&&!inactive)content.appendChild(el('div','description',p.descricao));
 const acts=el('div','actions');if(inactive){const b=el('div','act buy','Sem oferta ativa');acts.appendChild(b);}else{
  const go=el('a','act buy','Ver oferta ↗');go.href=safe(p.url_sol_garimpa||p.link);go.target='_blank';go.rel='sponsored noopener noreferrer';acts.appendChild(go);
  const send=el('button','act share','WhatsApp');send.type='button';send.setAttribute('aria-label',`Compartilhar oferta ${p.titulo}`);send.addEventListener('click',()=>window.open('https://wa.me/?text='+encodeURIComponent(message(p)),'_blank','noopener,noreferrer'));acts.appendChild(send);
 }
 content.appendChild(acts);box.appendChild(content);return box;
}
function art(p){const x=el('div','imgtext');x.appendChild(el('div','kind',p.tipo==='sem_oferta'?'Anunciante parceiro':p.tipo==='cupom'?'Cupom de desconto':'Oferta da loja'));x.appendChild(el('div','mark','✦'));x.appendChild(el('div','word',p.loja));return x;}
function rotateRoundRobin(items){const groups=new Map();for(const s of STORES)groups.set(s,[]);for(const o of items){if(groups.has(o.loja))groups.get(o.loja).push(o);}const out=[];let keep=true;while(keep){keep=false;for(const a of groups.values())if(a.length){out.push(a.shift());keep=true;}}return out;}
function display(){
 visible=all.filter(x=>selected==='Todas'||x.loja===selected);
 rail.replaceChildren();for(const p of visible)rail.appendChild(card(p));offset=0;view.scrollLeft=0;
 feedback.textContent = loaded ? `${visible.filter(x=>x.tipo!=='sem_oferta').length} ofertas encontradas • ${new Set(visible.filter(x=>x.tipo!=='sem_oferta').map(x=>x.loja)).size} lojas com ofertas disponíveis` : 'Ainda não há dados oficiais conectados. Nenhuma oferta fictícia será exibida.';
 $('prev').disabled=$('next').disabled=!visible.length;$('copy').disabled=!visible.some(p=>p.tipo!=='sem_oferta');
 }
function addFilters(){const names=['Todas',...STORES];filters.replaceChildren();for(const n of names){const b=el('button','pill',n);b.type='button';b.setAttribute('aria-pressed',String(n===selected));b.addEventListener('click',()=>{selected=n;addFilters();display();});filters.appendChild(b);}}
function placeholder(){all=STORES.map((loja,index)=>({id:'p'+index,loja,tipo:'sem_oferta',titulo:'Aguardando conexão às ofertas da Awin'}));loaded=false;addFilters();display();}
function accept(data){
 if(!data||!Array.isArray(data.cards))return;
 const d=timestamp(data.atualizado_em);
 if(!d||Date.now()-d.getTime()>24*3600*1000||d.getTime()>Date.now()+3600*1000){placeholder();feedback.textContent='Dados ausentes ou antigos. Aguardando uma atualização válida da Awin.';return;}
 const known=new Set(STORES);const sanitized=[];
 for(const p of data.cards){if(!known.has(p.loja)||!['produto','promocao','cupom','sem_oferta'].includes(p.tipo))continue;
  const inactive=p.tipo==='sem_oferta';
  if(!inactive&&!safe(p.link))continue;
  sanitized.push({...p,imagem:safe(p.imagem),link:safe(p.link)});
 }
 for(const s of STORES)if(!sanitized.some(x=>x.loja===s))sanitized.push({loja:s,tipo:'sem_oferta',titulo:'Nenhuma oferta vigente encontrada'});
 all=rotateRoundRobin(sanitized);loaded=true;
 $('stamp').textContent=`Atualizado em ${d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})} • Preços sujeitos à confirmação • Links de afiliado`;
 addFilters();display();
}
function shift(delta){if(!visible.length)return;const step=rail.firstElementChild?rail.firstElementChild.getBoundingClientRect().width+12:300;view.scrollBy({left:delta*step,behavior:'smooth'});}
$('prev').addEventListener('click',()=>shift(-1));$('next').addEventListener('click',()=>shift(1));$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'Continuar':'Pausar';});
$('copy').addEventListener('click',async()=>{
 const posts=visible.filter(p=>p.tipo!=='sem_oferta'&&p.link).slice(0,10).map(message);if(!posts.length)return;
 const text=posts.join('\n\n━━━━━━━━━━━━━━━━━━\n\n');
 try {await navigator.clipboard.writeText(text);$('feedback').textContent='Até 10 mensagens copiadas. Revise os dados antes de publicar.';}
 catch(_){const t=el('textarea');document.body.appendChild(t);t.value=text;t.select();try{document.execCommand('copy');$('feedback').textContent='Mensagens copiadas.';}catch(e){$('feedback').textContent='Cópia não disponível neste navegador.';}t.remove();}
});
setInterval(()=>{if(paused||!visible.length||document.hidden)return;const max=view.scrollWidth-view.clientWidth;const step=rail.firstElementChild?rail.firstElementChild.getBoundingClientRect().width+12:300;view.scrollTo({left:view.scrollLeft+step>max+5?0:view.scrollLeft+step,behavior:'smooth'});},4500);
window.addEventListener('message',ev=>{if(ev.data?.tipo==='SOL_GARIMPA_AWIN_22')accept(ev.data.payload);});
function ready(){try{window.parent.postMessage({tipo:'SOL_GARIMPA_AWIN_22_READY'},'*');}catch(e){}}
async function refresh(){if(!PUBLIC_JSON_URL)return ready();try{const url=new URL(PUBLIC_JSON_URL,location.href);if(url.protocol!=='https:')throw new Error('HTTPS obrigatório');url.searchParams.set('_t',String(Date.now()));const r=await fetch(url.href,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);accept(await r.json());}catch(e){placeholder();feedback.textContent='Sem conexão com o arquivo de ofertas. Verifique a URL pública configurada.';}}
placeholder();$('pause').textContent=paused?'Continuar':'Pausar';refresh();setInterval(refresh,15*60*1000);
})();
</script>
</body>
</html>
