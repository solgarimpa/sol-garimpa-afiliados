
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPs do Brasil | SOL GARIMPA - Lomadee</title>
<style>
:root{--amarelo:#ffd12a;--escuro:#1d1d1d;--borda:#e5e8ed}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--escuro);font:14px/1.4 Arial,sans-serif}
main{max-width:1450px;margin:auto;padding:10px}
header{text-align:center;margin:4px 0 12px}
h2{font-size:clamp(19px,3vw,27px);line-height:1.2;margin:0 0 7px}
mark{background:var(--amarelo);border-radius:5px;padding:1px 7px;color:#111;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pesquisa,.linha-lojas{display:flex;align-items:center;gap:6px;margin:9px 0}
.pesquisa input{flex:1;min-width:0;padding:11px;border:1px solid #d9dce1;border-radius:9px;font-size:13px}
.pesquisa button{border:0;border-radius:9px;padding:11px 10px;background:var(--amarelo);font-size:11px;font-weight:800;cursor:pointer}
.pesquisa .limpar{background:#f0f1f3}
.seta{flex:none;background:#fff;border:1px solid #ddd;border-radius:9px;padding:7px 12px;font-size:17px;font-weight:800;cursor:pointer}
.lojas{display:flex;flex:1;min-width:0;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;padding:2px 0}
.lojas::-webkit-scrollbar{display:none}
.loja-btn{flex:none;border:1px solid #e1e2e5;background:#fff;border-radius:25px;padding:8px 12px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer}
.loja-btn[aria-pressed="true"]{background:#252525;color:#fff;border-color:#252525}
#status{font-size:11px;color:#68717c;min-height:21px;margin:5px 0}
.janela{width:100%;overflow:hidden;touch-action:pan-y}
.trilho{display:flex;gap:12px;padding:3px 0 10px;will-change:transform}
.cartao{flex:0 0 268px;width:268px;display:flex;flex-direction:column;border:1px solid var(--borda);border-radius:15px;overflow:hidden;background:#fff}
.capa{height:171px;position:relative;display:flex;align-items:center;justify-content:center;background:white;border-bottom:1px solid #eee}
.capa img{max-width:91%;max-height:88%;width:auto;height:auto;object-fit:contain}
.sem-foto{font-size:21px;font-weight:900;text-align:center;padding:15px;overflow-wrap:anywhere}
.selo{position:absolute;right:7px;top:7px;background:#222;color:white;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800}
.conteudo{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:195px}
.marca{font-size:11px;color:#596270;font-weight:850}
.nome{font-size:13px;font-weight:850;line-height:1.3;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preco{font-size:19px;font-weight:900}
.antigo{font-size:10px;color:#888;font-weight:400;text-decoration:line-through;margin-left:7px}
.descricao{font-size:11px;color:#69717a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cupom{background:#fff2bc;border:1px dashed #c9a42a;border-radius:6px;padding:4px 7px;align-self:flex-start;font-size:11px;font-weight:800}
.acoes{display:flex;gap:7px;margin-top:auto;padding-top:7px}
.acao{flex:1;min-height:38px;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:9px;padding:7px 5px;font-size:11px;font-weight:850}
.comprar{background:var(--amarelo);color:#111}
.whatsapp{background:#ecf8ef;color:#176538;border:1px solid #c9e8ce}
.vazio{padding:25px;border:1px dashed #ddd;border-radius:12px;color:#666;font-size:12px;width:100%}
footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid #eee;padding:9px 0;color:#737b85;font-size:10px}
.controles{display:flex;gap:6px}
.controles button{background:#fff;border:1px solid #ddd;border-radius:8px;padding:7px 11px;font-size:11px;font-weight:800;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
@media(max-width:580px){
main{padding:7px 6px}
.cartao{width:250px;flex-basis:250px}
.capa{height:160px}
.pesquisa input{font-size:12px}
.pesquisa button{font-size:10px;padding:10px 7px}
}
@media(prefers-reduced-motion:reduce){.lojas{scroll-behavior:auto}}
</style>
</head>
<body>
<main>

<header>
<h2>As <mark>TOPs</mark> do Brasil em Oferta pra vc!</h2>
</header>

<form id="formBusca" class="pesquisa" role="search">
<input id="termo" type="search" placeholder="Pesquisar produto, marca ou loja" aria-label="Pesquisar ofertas" autocomplete="off">
<button type="submit">PESQUISAR</button>
<button type="button" id="limpar" class="limpar">Limpar</button>
</form>

<div class="linha-lojas">
<button type="button" id="lojasAntes" class="seta" aria-label="Lojas anteriores">‹</button>
<nav id="lojas" class="lojas" aria-label="Lojas parceiras"></nav>
<button type="button" id="lojasDepois" class="seta" aria-label="Próximas lojas">›</button>
</div>

<div id="status" role="status" aria-live="polite">Consultando ofertas...</div>

<section id="janela" class="janela" aria-label="Carrossel de ofertas">
<div id="trilho" class="trilho"></div>
</section>

<footer>
<span id="atualizacao">Preços sujeitos à confirmação nas lojas. Links de afiliados.</span>
<div class="controles">
<button type="button" id="anterior">‹</button>
<button type="button" id="pausar">Pausar</button>
<button type="button" id="proximo">›</button>
</div>
</footer>

</main>

<script>
(()=>{
'use strict';

// REDE EXCLUSIVA: LOMADEE
const FONTE='https://solgarimpa.github.io/sol-garimpa-afiliados/lomadee/ofertas.json';
const DESTAQUE='Xiaomi Brasil';

const $=id=>document.getElementById(id);
const trilho=$('trilho');
const nomes=$('lojas');
const janela=$('janela');

let todos=[],parceiros=[],visiveis=[];
let selecionada='TODOS',busca='',indice=0;
let pausado=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let animando=false,ultimaData='';

const normal=v=>String(v||'').normalize('NFD')
 .replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

const seguro=v=>{
 try{
  const u=new URL(String(v||''));
  return u.protocol==='https:'&&!u.username&&!u.password?u.href:'';
 }catch{return ''}
};

const moeda=v=>new Intl.NumberFormat('pt-BR',{
 style:'currency',currency:'BRL'
}).format(Number(v));

function el(tag,classe,texto){
 const e=document.createElement(tag);
 if(classe)e.className=classe;
 if(texto!==undefined)e.textContent=String(texto);
 return e;
}

function filtros(){
 const lista=[...new Set([
  ...parceiros,
  ...todos.map(p=>p.loja)
 ].filter(Boolean))];

 const ordem=['TODOS',DESTAQUE,
  ...lista.filter(x=>x!==DESTAQUE)
   .sort((a,b)=>a.localeCompare(b,'pt-BR'))];

 const scroll=nomes.scrollLeft;
 nomes.replaceChildren();

 for(const nome of ordem){
  const rotulo=nome==='TODOS'?'TODOS':
   nome===DESTAQUE?'Xiaomi':nome;

  const b=el('button','loja-btn',rotulo);
  b.type='button';
  b.setAttribute('aria-pressed',String(nome===selecionada));
  b.onclick=()=>{
   selecionada=nome;
   filtros();
   aplicar();
  };
  nomes.append(b);
 }
 nomes.scrollLeft=scroll;
}

function corresponde(p){
 const palavras=normal(busca).split(/\s+/).filter(Boolean);
 const texto=normal([
  p.loja,p.titulo,p.descricao,p.cupom,p.categoria
 ].join(' '));

 return (selecionada==='TODOS'||p.loja===selecionada)&&
  palavras.every(x=>texto.includes(x));
}

function imagem(p){
 const capa=el('div','capa');
 const fontes=[p.imagem,p.logo_url].map(seguro).filter(Boolean);
 let atual=0;

 function tentar(){
  if(atual>=fontes.length){
   capa.append(el('div','sem-foto',p.loja));
   return;
  }

  const fonte=fontes[atual++];
  const img=el('img');
  img.alt=p.titulo||p.loja;
  img.decoding='async';
  img.loading='lazy';
  img.onerror=()=>{
   img.remove();
   tentar();
  };
  img.onload=()=>{
   if(!/\.svg(?:[?#]|$)/i.test(fonte)&&
      (img.naturalWidth<110||img.naturalHeight<50)){
    img.remove();
    tentar();
   }
  };
  img.src=fonte;
  capa.append(img);
 }
 tentar();

 capa.append(el('span','selo',
  p.tipo==='cupom'?'CUPOM':
  p.tipo==='produto'?'PRODUTO':'OFERTA'));
 return capa;
}

function cartao(p){
 const artigo=el('article','cartao');
 artigo.append(imagem(p));
 const corpo=el('div','conteudo');

 corpo.append(
  el('div','marca',p.loja),
  el('div','nome',p.titulo)
 );

 const preco=Number(p.preco);
 const anterior=Number(p.preco_anterior);

 if(Number.isFinite(preco)&&preco>0){
  const valor=el('div','preco',moeda(preco));
  if(Number.isFinite(anterior)&&anterior>preco)
   valor.append(el('span','antigo',moeda(anterior)));
  corpo.append(valor);
 }else{
  corpo.append(el('div','descricao',
   'Confira o preço atualizado na loja.'));
 }

 if(p.cupom)corpo.append(el('div','cupom','Cupom: '+p.cupom));
 if(p.descricao)corpo.append(el('div','descricao',p.descricao));

 // Link de afiliado original da Lomadee.
 const destino=seguro(p.link);
 const acoes=el('div','acoes');

 const comprar=el('a','acao comprar','Ver oferta ↗');
 comprar.href=destino;
 comprar.target='_blank';
 comprar.rel='sponsored noopener noreferrer';

 const zap=el('a','acao whatsapp','WhatsApp');
 zap.href='https://wa.me/?text='+encodeURIComponent([
  '🛍️ OFERTA SOL GARIMPA',
  p.loja,p.titulo,
  preco>0?'💰 '+moeda(preco):'',
  p.cupom?'Cupom: '+p.cupom:'',
  '👉 '+destino
 ].filter(Boolean).join('\n'));
 zap.target='_blank';
 zap.rel='noopener noreferrer';

 acoes.append(comprar,zap);
 corpo.append(acoes);
 artigo.append(corpo);
 return artigo;
}

function desenhar(){
 trilho.style.transition='none';
 trilho.style.transform='translateX(0)';
 trilho.replaceChildren();

 if(!visiveis.length){
  trilho.append(el('div','vazio',
   'Nenhuma oferta encontrada. Tente outra pesquisa ou loja.'));
  return;
 }

 const qtd=Math.min(7,visiveis.length);
 for(let i=0;i<qtd;i++){
  trilho.append(cartao(
   visiveis[(indice+i)%visiveis.length]
  ));
 }
}

function aplicar(){
 visiveis=todos.filter(corresponde);
 indice=0;
 animando=false;
 desenhar();

 $('status').textContent=
  visiveis.length+' ofertas encontradas • '+
  new Set(visiveis.map(p=>p.loja)).size+' lojas';

 $('anterior').disabled=$('proximo').disabled=visiveis.length<2;
}

function mover(direcao){
 if(animando||visiveis.length<2)return;

 if(direcao<0){
  indice=(indice-1+visiveis.length)%visiveis.length;
  desenhar();
  return;
 }

 animando=true;
 const primeiro=trilho.querySelector('.cartao');
 const distancia=(primeiro?
  primeiro.getBoundingClientRect().width:268)+12;

 trilho.style.transition='transform .42s ease';
 trilho.style.transform='translateX(-'+distancia+'px)';

 setTimeout(()=>{
  indice=(indice+1)%visiveis.length;
  desenhar();
  animando=false;
 },440);
}

$('formBusca').onsubmit=e=>{
 e.preventDefault();
 busca=$('termo').value.trim();
 selecionada='TODOS';
 filtros();
 aplicar();
};

$('termo').oninput=()=>{
 busca=$('termo').value.trim();
 selecionada='TODOS';
 filtros();
 aplicar();
};

$('limpar').onclick=()=>{
 $('termo').value='';
 busca='';
 selecionada='TODOS';
 filtros();
 aplicar();
 $('termo').focus();
};

$('lojasAntes').onclick=()=>nomes.scrollBy({
 left:-260,behavior:'smooth'
});
$('lojasDepois').onclick=()=>nomes.scrollBy({
 left:260,behavior:'smooth'
});

$('anterior').onclick=()=>mover(-1);
$('proximo').onclick=()=>mover(1);
$('pausar').onclick=()=>{
 pausado=!pausado;
 $('pausar').textContent=pausado?'Continuar':'Pausar';
};
$('pausar').textContent=pausado?'Continuar':'Pausar';

let toque=null;
janela.addEventListener('touchstart',e=>{
 toque=e.touches[0]?.clientX??null;
},{passive:true});

janela.addEventListener('touchend',e=>{
 if(toque===null)return;
 const delta=e.changedTouches[0].clientX-toque;
 toque=null;
 if(Math.abs(delta)>35)mover(delta<0?1:-1);
},{passive:true});

setInterval(()=>{
 if(!pausado&&!document.hidden&&!janela.matches(':hover'))
  mover(1);
},4700);

async function atualizar(){
 try{
  const resposta=await fetch(
   FONTE+'?v='+Math.floor(Date.now()/300000),
   {cache:'no-store'}
  );
  if(!resposta.ok)throw Error('HTTP '+resposta.status);

  const dados=await resposta.json();
  if(!Array.isArray(dados.cards))
   throw Error('Catálogo Lomadee inválido');

  if(ultimaData===dados.atualizado_em)return;
  ultimaData=dados.atualizado_em;

  const cadastrados=Array.isArray(dados.parceiros)?
   dados.parceiros:[];

  parceiros=[
   DESTAQUE,
   ...cadastrados.map(p=>
    typeof p==='string'?p:p.loja||p.nome||''
   ).filter(Boolean)
  ];

  todos=dados.cards.filter(p=>
   p&&['produto','promocao','cupom'].includes(p.tipo)&&
   p.loja&&p.titulo&&seguro(p.link)
  );

  filtros();
  aplicar();

  const data=new Date(dados.atualizado_em);
  if(!Number.isNaN(data.getTime()))
   $('atualizacao').textContent='Atualizado em '+
    data.toLocaleString('pt-BR',{
     timeZone:'America/Sao_Paulo'
    })+' • Links de afiliados';

 }catch(erro){
  $('status').textContent=
   'Não foi possível carregar ofertas da Lomadee.';
  console.warn('Lomadee:',erro);
 }
}

filtros();
atualizar();
setInterval(atualizar,300000);
})();
</script>
</body>
</html>
