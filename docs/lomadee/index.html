<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Achadinhos das Lojas Queridinhas | Sol Garimpa</title><style>
:root{--sol:#fdd329;--ink:#1d1d1d;--muted:#68717d;--border:#e6e9ee}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font:14px Arial,sans-serif}.wrap{padding:17px 12px;max-width:1450px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:clamp(21px,4vw,29px);margin:5px 0}.solar{background:var(--sol);border-radius:7px;padding:0 7px}.sub{font-size:12px;color:var(--muted);margin-bottom:14px}.tag{border-radius:30px;background:#181818;color:var(--sol);padding:9px;font-size:11px;font-weight:bold}.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:12px 0}.filters::-webkit-scrollbar{display:none}.pill{border:1px solid var(--border);background:white;padding:9px 13px;border-radius:30px;white-space:nowrap;cursor:pointer}.pill.active{background:#171717;color:white}.status{font-size:12px;color:var(--muted);min-height:24px}.viewport{overflow:auto;scrollbar-width:none;scroll-snap-type:x mandatory}.viewport::-webkit-scrollbar{display:none}.rail{display:flex;gap:13px;padding:5px 2px 13px}.card{scroll-snap-align:start;flex:0 0 min(77vw,290px);min-height:354px;border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#fff}.visual{height:190px;background:#f7f7f8;display:flex;justify-content:center;align-items:center;position:relative}.visual img{max-width:95%;max-height:95%;object-fit:contain}.brand{font-weight:bold;font-size:22px;text-align:center}.badge{position:absolute;right:10px;top:10px;background:var(--ink);color:white;padding:6px 9px;font-size:11px;border-radius:8px}.info{display:flex;flex-direction:column;gap:8px;padding:13px;flex:1}.store{font-size:11px;color:#6e727c}.name{font-size:15px;font-weight:800;min-height:38px}.price{font-size:21px;font-weight:900}.price del{font-size:12px;color:#8c939b;font-weight:400;margin-left:7px}.coupon{font-size:12px;background:#fff2bc;padding:5px 8px;border:1px dashed #d2a000;border-radius:7px;width:max-content;max-width:100%;overflow-wrap:anywhere}.actions{display:flex;gap:7px;margin-top:auto}.go,.share{border:0;text-decoration:none;font-weight:800;font-size:12px;border-radius:10px;padding:12px 8px;flex:1;text-align:center;cursor:pointer}.go{background:var(--sol);color:#1c1c1c}.share{background:#e7f6ea;color:#185a25}.foot{display:flex;justify-content:space-between;gap:7px;align-items:center;border-top:1px solid #eee;padding-top:10px;font-size:11px;color:var(--muted)}.ctl{padding:8px 10px;border:1px solid var(--border);background:white;border-radius:8px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #2368de}@media(min-width:900px){.card{flex-basis:305px}}
</style></head><body><main class="wrap"><header><div><div style="font-size:11px;letter-spacing:1px;font-weight:900">OFERTAS DAS MARCAS PARCEIRAS</div><h2>Achadinhos das <span class="solar">Lojas Queridinhas</span> do Brasil</h2></div><div class="tag">SOL GARIMPA ✦</div></header><div class="sub">Ofertas, produtos e cupons de marcas parceiras. Preços sujeitos à confirmação nas lojas.</div><nav class="filters" id="filters"></nav><div class="status" id="status">Consultando ofertas...</div><div class="viewport" id="viewport"><div class="rail" id="rail"></div></div><footer class="foot"><span id="updated">Aguardando informações oficiais</span><div><button class="ctl" id="prev" aria-label="Anterior">‹</button><button class="ctl" id="pause">Pausar</button><button class="ctl" id="next" aria-label="Próximo">›</button></div></footer></main><script>
(()=>{'use strict';const JSON_URL='https://raw.githubusercontent.com/solgarimpa/sol-garimpa-afiliados/main/docs/lomadee/ofertas.json', $=id=>document.getElementById(id), safe=v=>{try{let u=new URL(v);return u.protocol==='https:'?u.href:''}catch(e){return ''}},money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);let cards=[],store='Todas',paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const node=(tag,cls,txt)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};function card(p){let c=node('article','card'),v=node('div','visual');if(p.imagem){let img=node('img');img.loading='lazy';img.alt=p.titulo;img.src=p.imagem;img.onerror=()=>{img.remove();v.appendChild(node('div','brand',p.loja))};v.appendChild(img)}else v.appendChild(node('div','brand',p.loja));v.appendChild(node('div','badge',p.cupom?'Cupom':'Oferta'));c.appendChild(v);let d=node('div','info');d.appendChild(node('div','store',p.loja));d.appendChild(node('div','name',p.titulo));if(p.preco>0){let x=node('div','price',money(p.preco));if(p.preco_anterior>p.preco)x.appendChild(node('del','',money(p.preco_anterior)));d.appendChild(x)}else d.appendChild(node('div','store','Consulte as condições na loja'));if(p.cupom)d.appendChild(node('span','coupon','Cupom: '+p.cupom));let actions=node('div','actions'),a=node('a','go','Ver oferta ↗');a.href=p.link;a.target='_blank';a.rel='sponsored noopener noreferrer';actions.appendChild(a);let w=node('button','share','WhatsApp');w.onclick=()=>{const t=['🛍️ OFERTA SOL GARIMPA','🏬 '+p.loja,p.titulo,p.preco?'💰 '+money(p.preco):'',p.cupom?'🎟️ Cupom: '+p.cupom:'','👉 '+p.link].filter(Boolean).join('\n');window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener,noreferrer')};actions.appendChild(w);d.appendChild(actions);c.appendChild(d);return c}function draw(){let current=cards.filter(p=>store==='Todas'||p.loja===store),rail=$('rail');rail.replaceChildren(...current.map(card));$('status').textContent=current.length?current.length+' ofertas disponíveis':'Nenhuma oferta ativa encontrada para esta seleção.';rail.parentElement.scrollLeft=0;const filters=$('filters'),names=['Todas',...new Set(cards.map(p=>p.loja))];filters.replaceChildren(...names.map(n=>{let b=node('button','pill'+(store===n?' active':''),n);b.onclick=()=>{store=n;draw()};return b}))}async function load(){try{let url=new URL(JSON_URL,location.href);url.searchParams.set('_',Date.now());let res=await fetch(url.href,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let d=await res.json();if(!Array.isArray(d.cards))throw Error('JSON sem cards');let t=new Date(d.atualizado_em);if(!Number.isFinite(t.getTime())||Date.now()-t.getTime()>48*3600000||t.getTime()>Date.now()+3600000)throw Error('Feed ainda não atualizado ou antigo');cards=d.cards.filter(p=>p&&['produto','promocao','cupom'].includes(p.tipo)&&safe(p.link)&&p.loja&&p.titulo).filter(p=>!p.validade||new Date(p.validade).getTime()>=Date.now()).map(p=>({...p,link:safe(p.link),imagem:safe(p.imagem),preco:Number(p.preco)>0?Number(p.preco):null,preco_anterior:Number(p.preco_anterior)>0?Number(p.preco_anterior):null}));$('updated').textContent='Atualizado em '+t.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})+' • Consulte a loja';draw()}catch(e){cards=[];draw();$('status').textContent='Aguardando catálogo autorizado da Lomadee. '+e.message}}function step(n){let el=$('viewport'),c=$('rail').firstElementChild;el.scrollBy({left:n*(c?c.getBoundingClientRect().width+13:300),behavior:'smooth'})}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Continuar':'Pausar'};setInterval(()=>{if(paused||document.hidden||!cards.length)return;const el=$('viewport');if(el.scrollLeft+el.clientWidth>=el.scrollWidth-10)el.scrollTo({left:0,behavior:'smooth'});else step(1)},4500);load();setInterval(load,300000)})();
</script></body></html>
