
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>As TOPs do Brasil em Oferta pra vc! | SOL GARIMPA</title>
<style>
:root{
  --yellow:#ffd12a;
  --ink:#1d1d1d;
  --muted:#656c78;
  --line:#e5e8ed;
  --gap:12px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow:hidden;
  background:#fff;
  color:var(--ink);
  font:14px/1.36 -apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,Arial,sans-serif;
}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.shell{
  width:100%;
  max-width:1450px;
  margin:0 auto;
  padding:9px 10px 4px;
  overflow:hidden;
}
.head{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  min-height:58px;
  padding:4px 12px 5px;
}
.head-content{
  width:100%;
  min-width:0;
  text-align:center;
}
h2{
  font-size:clamp(19px,3vw,26px);
  line-height:1.16;
  letter-spacing:-.5px;
  margin:3px 0;
  font-weight:850;
  text-align:center;
}
h2 mark{
  background:var(--yellow);
  color:#141414;
  border-radius:5px;
  padding:0 7px;
}
.filters{
  display:flex;
  align-items:center;
  gap:6px;
  margin:8px 0 5px;
  width:100%;
  min-width:0;
}
.scroll{
  display:flex;
  gap:6px;
  flex:1;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
  scroll-behavior:smooth;
  padding:2px 0;
}
.scroll::-webkit-scrollbar,
.viewport::-webkit-scrollbar{display:none}
.pill{
  border:1px solid #e1e2e5;
  background:#fff;
  color:#343434;
  border-radius:24px;
  padding:7px 11px;
  white-space:nowrap;
  font-size:11px;
  font-weight:750;
  flex:0 0 auto;
}
.pill[aria-pressed="true"]{
  color:#fff;
  background:#252525;
  border-color:#252525;
}
.nav{
  flex:0 0 auto;
  background:#fff;
  color:#222;
  border:1px solid #dedede;
  padding:6px 10px;
  border-radius:9px;
  font-weight:800;
}
.results{
  font-size:11px;
  color:var(--muted);
  height:18px;
  margin-bottom:4px;
}
.viewport{
  position:relative;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  touch-action:pan-x pan-y;
}
.rail{
  display:flex;
  gap:var(--gap);
  padding:2px 0 6px;
  align-items:stretch;
}
.card{
  display:flex;
  flex-direction:column;
  flex:0 0 268px;
  width:268px;
  min-width:0;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 3px 12px #00000008;
  scroll-snap-align:start;
}
.cover{
  height:162px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
  border-bottom:1px solid #f1f2f4;
}
.cover img.photo{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  padding:5px;
  background:#fff;
}
.logo-fallback{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  text-align:center;
  font-size:22px;
  font-weight:850;
  padding:14px;
  overflow-wrap:anywhere;
}
.flag{
  position:absolute;
  top:6px;
  right:6px;
  font-weight:850;
  font-size:10px;
  color:#fff;
  background:#222;
  padding:4px 8px;
  border-radius:7px;
}
.content{
  display:flex;
  flex-direction:column;
  flex:1;
  gap:5px;
  padding:9px 10px 10px;
  min-height:176px;
}
.store{
  font-size:11px;
  font-weight:850;
  color:#56606d;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.name{
  font-size:13px;
  font-weight:850;
  line-height:1.25;
  min-height:32px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.price{
  font-size:18px;
  font-weight:950;
  line-height:1.2;
}
.old{
  font-size:10px;
  color:#767676;
  font-weight:500;
  text-decoration:line-through;
  margin-left:5px;
}
.desc{
  font-size:10px;
  color:#66717b;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.coupon{
  align-self:flex-start;
  background:#fff2bc;
  border:1px dashed #c9a42a;
  border-radius:5px;
  padding:3px 7px;
  font-size:10px;
  font-weight:800;
  overflow-wrap:anywhere;
}
.actions{
  margin-top:auto;
  display:flex;
  gap:6px;
  padding-top:5px;
}
.action{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:none;
  border-radius:9px;
  min-height:35px;
  padding:7px 6px;
  font-size:11px;
  font-weight:850;
  text-decoration:none;
}
.go{
  background:var(--yellow);
  color:#141414;
}
.share{
  background:#ecf8ef;
  color:#176538;
  border:1px solid #c9e8ce;
}
.bottom{
  border-top:1px solid #ededed;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:4px;
  padding-top:7px;
}
.stamp{
  font-size:10px;
  color:#727783;
}
.controls{
  display:flex;
  gap:6px;
}
.ctrl{
  background:#fff;
  border:1px solid #ddd;
  color:#333;
  border-radius:8px;
  padding:6px 10px;
  font-size:11px;
  font-weight:800;
}
:focus-visible{
  outline:3px solid #1567c1;
  outline-offset:2px;
}
@media(max-width:580px){
  .shell{padding:7px 5px 3px}
  .head{min-height:64px;padding:4px 3px 5px}
  h2{font-size:18px}
  .card{flex-basis:250px;width:250px}
  .cover{height:164px}
  .bottom{flex-wrap:wrap}
  .results{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  .scroll,.viewport{scroll-behavior:auto}
}
</style>
</head>
<body>
<main class="shell">
  <header class="head">
    <div class="head-content">
      <h2>As <mark>TOPs</mark> do Brasil em Oferta pra vc!</h2>
    </div>
  </header>

  <div class="filters">
    <button type="button" class="nav" id="brandPrev"
      aria-label="Marcas anteriores">‹</button>
    <nav class="scroll" id="brands"
      aria-label="Filtrar lojas"></nav>
    <button type="button" class="nav" id="brandNext"
      aria-label="Mais marcas">›</button>
  </div>

  <div class="results" id="status" role="status">
    Consultando ofertas...
  </div>

  <section class="viewport" id="viewport" tabindex="0"
    aria-label="Carrossel de ofertas; deslize para navegar">
    <div class="rail" id="rail"></div>
  </section>

  <div class="bottom">
    <span class="stamp" id="stamp">
      Preços sujeitos à confirmação nas lojas. Links de afiliado.
    </span>
    <div class="controls">
      <button type="button" class="ctrl" id="prev"
        aria-label="Oferta anterior">‹</button>
      <button type="button" class="ctrl" id="pause">Pausar</button>
      <button type="button" class="ctrl" id="next"
        aria-label="Próxima oferta">›</button>
    </div>
  </div>
</main>

<script>
(()=>{
'use strict';

const SOURCE =
  'https://solgarimpa.github.io/sol-garimpa-afiliados/lomadee/ofertas.json';

const REFRESH = 5*60*1000;
const AUTO = 4700;

const $ = id => document.getElementById(id);
const rail = $('rail');
const viewport = $('viewport');
const brands = $('brands');

const safe = value => {
  try {
    const u = new URL(String(value||''));
    return u.protocol==='https:' && !u.username && !u.password
      ? u.href : '';
  } catch {
    return '';
  }
};

const money = value =>
  new Intl.NumberFormat('pt-BR',{
    style:'currency',
    currency:'BRL'
  }).format(Number(value));

const node = (tag,cls='',txt) => {
  const e = document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=String(txt);
  return e;
};

let all=[];
let selected='Todas';
let paused=window.matchMedia(
  '(prefers-reduced-motion: reduce)'
).matches;
let stamp='';

function card(p){
  const box=node('article','card');
  const cover=node('div','cover');

  if(p.imagem){
    const img=node('img','photo');
    img.alt=p.titulo;
    img.src=p.imagem;
    img.loading='lazy';
    img.decoding='async';
    img.onerror=()=>{
      img.remove();
      cover.append(node('div','logo-fallback',p.loja));
    };
    cover.append(img);
  }else{
    cover.append(node('div','logo-fallback',p.loja));
  }

  cover.append(node(
    'span','flag',
    p.tipo==='cupom'?'Cupom':
    p.tipo==='produto'?'Produto':'Promoção'
  ));
  box.append(cover);

  const content=node('div','content');
  content.append(
    node('div','store',p.loja),
    node('div','name',p.titulo)
  );

  if(p.preco>0){
    const price=node('div','price',money(p.preco));
    if(p.preco_anterior>p.preco){
      price.append(
        node('span','old',money(p.preco_anterior))
      );
    }
    content.append(price);
  }

  if(p.cupom){
    content.append(
      node('span','coupon','Cupom: '+p.cupom)
    );
  }

  if(p.descricao){
    content.append(
      node('div','desc',p.descricao)
    );
  }

  const actions=node('div','actions');
  const go=node('a','action go','Ver oferta ↗');
  const share=node('a','action share','WhatsApp');

  go.href=p.link;
  go.target='_blank';
  go.rel='sponsored noopener noreferrer';

  share.href='https://wa.me/?text='+
    encodeURIComponent([
      '🛍️ OFERTA SOL GARIMPA',
      '🏬 '+p.loja,
      p.titulo,
      p.preco>0?'💰 '+money(p.preco):'',
      p.cupom?'🎟️ Cupom: '+p.cupom:'',
      '👉 '+p.link
    ].filter(Boolean).join('\n'));

  share.target='_blank';
  share.rel='noopener noreferrer';

  actions.append(go,share);
  content.append(actions);
  box.append(content);
  return box;
}

function display(){
  const items=all.filter(
    p=>selected==='Todas'||p.loja===selected
  );

  rail.replaceChildren(...items.map(card));
  viewport.scrollLeft=0;

  $('status').textContent=items.length
    ?`${items.length} ofertas disponíveis • ${
      new Set(items.map(p=>p.loja)).size
    } lojas`
    :'Nenhuma oferta ativa nesta seleção.';

  $('prev').disabled=$('next').disabled=items.length<2;
}

function updateNav(){
  const max=brands.scrollWidth-brands.clientWidth;
  $('brandPrev').disabled=brands.scrollLeft<=4;
  $('brandNext').disabled=
    max<=4||brands.scrollLeft>=max-4;
}

function renderFilters(){
  const names=['Todas',...new Set(all.map(p=>p.loja))];
  brands.replaceChildren();

  for(const name of names){
    const b=node('button','pill',name);
    b.type='button';
    b.setAttribute(
      'aria-pressed',String(name===selected)
    );
    b.onclick=()=>{
      selected=name;
      renderFilters();
      display();
    };
    brands.append(b);
  }
  updateNav();
}

function step(dir){
  const first=rail.querySelector('.card');
  if(!first)return;

  const s=first.getBoundingClientRect().width+12;
  const max=viewport.scrollWidth-viewport.clientWidth;
  const next=viewport.scrollLeft+dir*s;

  viewport.scrollTo({
    left:next>max+5?0:next<0?max:next,
    behavior:'smooth'
  });
}

$('brandPrev').onclick=()=>
  brands.scrollBy({left:-220,behavior:'smooth'});

$('brandNext').onclick=()=>
  brands.scrollBy({left:220,behavior:'smooth'});

brands.addEventListener(
  'scroll',updateNav,{passive:true}
);

$('prev').onclick=()=>step(-1);
$('next').onclick=()=>step(1);

$('pause').onclick=()=>{
  paused=!paused;
  $('pause').textContent=paused?'Continuar':'Pausar';
};

$('pause').textContent=paused?'Continuar':'Pausar';

setInterval(()=>{
  if(
    !paused &&
    !document.hidden &&
    !viewport.matches(':hover')
  )step(1);
},AUTO);

async function refresh(){
  try{
    const url=new URL(SOURCE);
    url.searchParams.set('v',String(Date.now()));

    const response=await fetch(url.href,{
      cache:'no-store'
    });

    if(!response.ok){
      throw Error('HTTP '+response.status);
    }

    const data=await response.json();
    if(!Array.isArray(data.cards)){
      throw Error('Catálogo inválido');
    }

    const date=Date.parse(data.atualizado_em);
    if(
      !Number.isFinite(date) ||
      date>Date.now()+3600000 ||
      Date.now()-date>48*3600000
    ){
      throw Error('Catálogo desatualizado');
    }

    if(stamp===data.atualizado_em)return;
    stamp=data.atualizado_em;

    all=data.cards
      .filter(p=>
        p &&
        ['produto','promocao','cupom'].includes(p.tipo) &&
        p.loja && p.titulo && safe(p.link)
      )
      .filter(p=>
        !p.validade ||
        (
          Number.isFinite(Date.parse(p.validade)) &&
          Date.parse(p.validade)>=Date.now()
        )
      )
      .map(p=>({
        ...p,
        link:safe(p.link),
        imagem:safe(p.imagem),
        preco:Number(p.preco)>0
          ?Number(p.preco):null,
        preco_anterior:Number(p.preco_anterior)>0
          ?Number(p.preco_anterior):null
      }));

    if(
      selected!=='Todas' &&
      !all.some(p=>p.loja===selected)
    ){
      selected='Todas';
    }

    renderFilters();
    display();

    $('stamp').textContent=
      'Atualizado em '+
      new Date(date).toLocaleString('pt-BR',{
        timeZone:'America/Sao_Paulo'
      })+
      ' • Preços sujeitos à confirmação • Links de afiliado';

  }catch(e){
    if(!all.length){
      $('status').textContent=
        'Não foi possível carregar as ofertas agora.';
    }
    console.warn('Lomadee:',e.message);
  }
}

window.addEventListener('resize',updateNav);
refresh();
setInterval(refresh,REFRESH);
})();
</script>
</body>
</html>
