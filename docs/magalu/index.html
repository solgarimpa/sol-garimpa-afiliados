<style>
  :root {--cor:#0086ff;--escuro:#182237;--borda:#e7eaf1}
  * {box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--escuro);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .sc{position:relative;overflow:hidden;padding:14px 0 13px;max-width:100%}

  .detalhes{padding:0 12px 11px;display:flex;flex-direction:column;flex:1;gap:7px}

  .aviso{font-size:10px;color:#727b8d;text-align:center;padding:10px 16px 0}
  .erro{display:none;margin:5px 14px 15px;color:#6b7280;font-size:13px;padding:20px;border:1px dashed #b6c3da;border-radius:12px}
  @media(max-width:520px){.cab{padding:0 10px 10px}.ver-vitrine{font-size:11px;max-width:115px;text-align:right;white-space:normal}.controles{margin:11px 10px 0}.status{font-size:11px}.card{width:156px;min-width:156px;min-height:272px}.foto{height:138px}.trilha{gap:9px}.nome{font-size:12px}.detalhes{padding:0 9px 9px}.tools button{padding:7px 9px}}
  @media(prefers-reduced-motion:reduce){.trilha{animation:none;max-width:100%;overflow-x:auto}.janela{overflow:auto;mask-image:none}}

<body>
<section class="sc" aria-label="Carrossel de ofertas Magalu Sol Garimpa">

<script>
/* SOL GARIMPA — Versão Wix/GitHub — 08/11/2026
  SUPORTA ATÉ 1000 PRODUTOS reais, mas não os gera por conta própria.
  Atualização por JSON: publicar arquivo https://.../magalu-produtos.json no servidor com CORS liberado;
  colar abaixo em CATALOGO_JSON_URL, ou usar CATALOGO_CSV_URL para planilha publicada.
  Sem endereço, usa os 5 itens de demonstração.
  Cada registro: { id, nome, imagem, link, categoria, preco } (preco opcional, numérico BRL).
  IMPORTANTE: links de afiliado devem ser os LINKS REAIS gerados ou confirmados na sua conta.
  Não inferir nem acrescentar promoter_id em links de terceiros.
*/
const CATALOGO_JSON_URL = ''; // URL HTTPS pública de arquivo JSON (opcional)
const CATALOGO_CSV_URL = '';  // Alternativa: URL HTTPS pública de uma planilha publicada em CSV
const LOJA_OFICIAL='https://www.magazinevoce.com.br/magazinesolgarimpa/';
const PRODUTOS_INICIAIS = [
  {

    "link": "https://www.magazinevoce.com.br/magazinesolgarimpa/potes-de-vidro-p-mantimentos-600ml-c-tampa-bambu-3-pcs-oikos/p/dc5f7d7gf4/ud/porm/?seller_id=lojamozcada",

const q=(s)=>document.querySelector(s);
let pausado=false,vel=0,lista=[];
function ehLinkSeguro(link){
 try {const u=new URL(link); if(u.protocol!=='https:')return false;
  const host=u.hostname.toLowerCase();
  return (host==='www.magazinevoce.com.br' && u.pathname.startsWith('/magazinesolgarimpa/')) ||
         (host==='magazinevoce.com.br' && u.pathname.startsWith('/magazinesolgarimpa/')) ||
         (host==='magazineluiza.onelink.me' && u.pathname.startsWith('/589508454/'));
 }catch(e){return false;}
}
function fonteValida(link){try{const u=new URL(link);return u.protocol==='https:'?u.href:null;}catch(e){return null;}}
function limpar(p){if(!p || !p.nome || !p.imagem || !p.link)return null;
 const link=String(p.link); if(!ehLinkSeguro(link))return null;
 const imagem=fonteValida(String(p.imagem));if(!imagem)return null;
 return {id:String(p.id||p.nome).slice(0,80),nome:String(p.nome).slice(0,180),categoria:String(p.categoria||'Ofertas Magalu').slice(0,55),imagem,link,preco:(typeof p.preco==='number'&&p.preco>0&&Number.isFinite(p.preco))?p.preco:null};
}
function embaralhar(xs){const a=xs.slice(); for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// A cada visita, sortear uma nova frente da vitrine.
// Quando o armazenamento estiver disponível, dar preferência aos itens que
// apareceram menos nas primeiras posições das últimas visitas.
// No modo privado ou com bloqueio de armazenamento, mantém o sorteio normal.
const CHAVE_FRENTE='solgarimpa_magalu_primeiros_v2';
function lerFrentes(){
 for(const armazenamento of [()=>localStorage,()=>sessionStorage]){
  try{
   const h=JSON.parse(armazenamento().getItem(CHAVE_FRENTE)||'[]');
   if(Array.isArray(h))return h.filter(v=>Array.isArray(v)).slice(0,5);
  }catch(e){}
 }
 return [];
}
function salvarFrentes(frentes){
 const valor=JSON.stringify(frentes.slice(0,5));
 try{localStorage.setItem(CHAVE_FRENTE,valor);return;}catch(e){}
 try{sessionStorage.setItem(CHAVE_FRENTE,valor);}catch(e){}
}
function ordenarParaVisita(produtos){
 const misturados=embaralhar(produtos);
 if(misturados.length<2)return misturados;
 const historico=lerFrentes();
 const penalidade=new Map();
 historico.forEach((ids,visita)=>ids.forEach((id,pos)=>{
  const chave=String(id);
  penalidade.set(chave,(penalidade.get(chave)||0)+(6-visita)*(4-pos));
 }));
 // O sorteio anterior desempata as pontuações e evita uma sequência fixa.
 misturados.sort((a,b)=>(penalidade.get(a.id)||0)-(penalidade.get(b.id)||0));
 // Garantir que o primeiro item não seja o mesmo da visita imediatamente anterior.
 const ultimo=historico[0]?.[0];
 if(ultimo!==undefined && misturados[0].id===String(ultimo)){
  const alternativa=misturados.findIndex(p=>p.id!==String(ultimo));
  if(alternativa>0)[misturados[0],misturados[alternativa]]=[misturados[alternativa],misturados[0]];
 }
 const visiveis=Math.min(3,misturados.length);
 salvarFrentes([misturados.slice(0,visiveis).map(p=>p.id),...historico]);
 return misturados;
}
function card(p){
 const a=document.createElement('a');a.className='card';a.href=p.link;a.target='_blank';a.rel='noopener noreferrer sponsored';a.title='Ver '+p.nome+' no Magalu';
 const foto=document.createElement('div');foto.className='foto';const img=document.createElement('img');img.loading='lazy';img.src=p.imagem;img.alt=p.nome;
 img.addEventListener('error',()=>{img.remove();const x=document.createElement('span');x.className='semfoto';x.textContent='Foto temporariamente indisponível';foto.append(x);},{once:true});
 foto.append(img);const det=document.createElement('div');det.className='detalhes';
 const cat=document.createElement('span');cat.className='categoria';cat.textContent=p.categoria;
 const nome=document.createElement('span');nome.className='nome';nome.textContent=p.nome;
 const preco=document.createElement('div');preco.className=p.preco!==null?'preco':'preco vazio';preco.textContent=p.preco!==null?p.preco.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Confira o preço na loja';
 const cta=document.createElement('div');cta.className='cta';cta.textContent='Ver no Magalu ↗';
 det.append(cat,nome,preco,cta);a.append(foto,det);return a;
}
function montar(raw){
 const vistos=new Set();const validos=[];
 for(const x of raw){const p=limpar(x);if(!p||vistos.has(p.id))continue;vistos.add(p.id);validos.push(p);if(validos.length>=1000)break;}
 lista=ordenarParaVisita(validos);const trilha=q('#trilha');trilha.replaceChildren();
 if(!lista.length){q('#erro').style.display='block';return;}
 q('#erro').style.display='none';const frag=document.createDocumentFragment();
 /* Repetir exatamente o conjunto (sem inventar novos produtos) cria loop contínuo. */
 const grupo1=document.createElement('div');grupo1.style.cssText='display:flex;gap:inherit;align-items:stretch;flex:none';
 for(const p of lista)grupo1.append(card(p));frag.append(grupo1);const grupo2=grupo1.cloneNode(true);grupo2.setAttribute('aria-hidden','true');for(const a of grupo2.querySelectorAll('a'))a.tabIndex=-1;frag.append(grupo2);
 trilha.append(frag);const medir=()=>{const gap=Number.parseFloat(getComputedStyle(trilha).gap)||0;const metade=grupo1.getBoundingClientRect().width+gap;
    trilha.style.setProperty('--metade',metade+'px');const segundos=Math.max(15,metade/40);trilha.style.setProperty('--duracao',segundos+'s');};
 requestAnimationFrame(medir);window.addEventListener('resize',medir,{passive:true});if(pausado)trilha.classList.add('pausado');
}
function lerCSV(texto){
 const linhas=[];let linha=[],valor='',dentro=false;
 texto=texto.replace(/^\uFEFF/,'');
 for(let i=0;i<texto.length;i++){
  const c=texto[i];
  if(c==='"'){
   if(dentro && texto[i+1]==='"'){valor+='"';i++;}else dentro=!dentro;
  }else if(c===','&&!dentro){linha.push(valor);valor='';}
  else if((c==='\n'||c==='\r')&&!dentro){
   if(c==='\r'&&texto[i+1]==='\n')i++;
   linha.push(valor);if(linha.some(x=>x.trim()))linhas.push(linha);linha=[];valor='';
  }else valor+=c;
 }
 if(valor||linha.length){linha.push(valor);linhas.push(linha);}
 const cab=linhas.shift()?.map(s=>s.trim())||[];
 return linhas.map(l=>{
  const p={};cab.forEach((key,i)=>p[key]=(l[i]||'').trim());
  if(p.preco){const v=p.preco.replace(/R\$/gi,'').replace(/\./g,'').replace(',','.').trim();p.preco=Number(v)||undefined;}
  return p;
 });
}
async function iniciar(){let produtos=PRODUTOS_INICIAIS;
 if(CATALOGO_JSON_URL || CATALOGO_CSV_URL){try{const csv=!!CATALOGO_CSV_URL&&!CATALOGO_JSON_URL;const u=new URL(CATALOGO_JSON_URL||CATALOGO_CSV_URL);if(u.protocol!=='https:')throw Error('URL do catálogo requer HTTPS');
 const resp=await fetch(u.href,{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);const dados=csv?lerCSV(await resp.text()):await resp.json();
 if(!Array.isArray(dados))throw Error('Catálogo precisa ser uma lista JSON');produtos=dados;
 }catch(e){console.warn('Falha ao carregar catálogo externo; exibindo itens iniciais:',e);}}
 montar(produtos);
}
q('#pausa').addEventListener('click',()=>{pausado=!pausado;const t=q('#trilha');t.classList.toggle('pausado',pausado);q('#pausa').textContent=pausado?'Reproduzir':'Pausar';q('#pausa').setAttribute('aria-pressed',String(pausado));q('#pausa').setAttribute('aria-label',pausado?'Reproduzir animação':'Pausar reprodução');});
function mover(sinal){const trilha=q('#trilha');trilha.classList.add('pausado');pausado=true;q('#pausa').textContent='Reproduzir';q('#pausa').setAttribute('aria-pressed','true');q('#pausa').setAttribute('aria-label','Reproduzir animação');
 const grupo=trilha.firstElementChild, tamanho=grupo.getBoundingClientRect().width+12;
 const e=trilha.getAnimations()[0];if(e&&tamanho){const delta=Math.min(210,tamanho);const pct=delta/tamanho;const dur=e.effect.getTiming().duration;
 e.currentTime=(((e.currentTime||0)+(sinal*dur*pct))%dur+dur)%dur;}}
q('#ant').addEventListener('click',()=>mover(-1));q('#prox').addEventListener('click',()=>mover(1));
iniciar();
</script>
