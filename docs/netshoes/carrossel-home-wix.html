<!-- SOL GARIMPA | Carrossel NETSHOES para a pagina inicial do Wix -->
<div id="sol-netshoes-home" style="display:block;width:100%;min-height:610px;overflow:hidden;background:#fff;">
  <div id="sol-netshoes-status" style="padding:18px;text-align:center;font:13px Arial,sans-serif;color:#5c4580;">Carregando ofertas Netshoes...</div>
</div>
<script>
(function(){
  'use strict';
  var alvo=document.getElementById('sol-netshoes-home');
  var fonte='https://raw.githubusercontent.com/solgarimpa/sol-garimpa-afiliados/main/docs/netshoes/carrossel-home.html';
  var versao=Math.floor(Date.now()/900000);
  fetch(fonte+'?v='+versao,{cache:'no-store'})
    .then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.text();})
    .then(function(html){
      if(html.indexOf('Carrossel Netshoes | Sol Garimpa')<0)throw new Error('HTML inesperado');
      var frame=document.createElement('iframe');
      frame.title='Achadinhos Netshoes - Sol Garimpa';
      frame.setAttribute('scrolling','no');
      frame.setAttribute('allow','clipboard-write');
      frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
      frame.style.cssText='display:block;width:100%;height:600px;border:0;overflow:hidden;background:#fff;';
      frame.srcdoc=html;
      alvo.replaceChildren(frame);
    })
    .catch(function(err){
      var msg=document.createElement('p');
      msg.textContent='Carrossel temporariamente indisponivel.';
      msg.style.cssText='font:13px Arial,sans-serif;color:#666;';
      var link=document.createElement('a');
      link.href='https://solgarimpa.github.io/sol-garimpa-afiliados/netshoes/';
      link.target='_blank';link.rel='noopener noreferrer';
      link.textContent='Ver vitrine Netshoes';
      link.style.cssText='color:#6500b8;font:bold 13px Arial,sans-serif;';
      alvo.replaceChildren(msg,link);
      alvo.style.minHeight='100px';
      console.warn('SOL GARIMPA Netshoes:',err.message);
    });
})();
</script>
