
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achadinhos das Lojas Queridinhas do Brasil | SOL GARIMPA</title>
<style>
:root{--yellow:#ffd12a;--ink:#1d1d1d;--muted:#656c78;--line:#e5e8ed;--gap:12px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;overflow:hidden;background:white;color:var(--ink);font:14px/1.36 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4}
.shell{max-width:1450px;margin:0 auto;padding:9px 10px 4px}
.head{text-align:center;display:flex;align-items:center;justify-content:center;min-height:58px}
h2{font-size:clamp(19px,3vw,26px);line-height:1.16;letter-spacing:-.5px;margin:3px 0}
mark{background:var(--yellow);color:#141414;border-radius:5px;padding:0 7px}
.sub{font-size:11px;color:var(--muted);margin:0;text-align:center}
.filters{display:flex;gap:6px;align-items:center;margin:8px 0 5px;min-width:0}
.scroll{display:flex;gap:6px;flex:1;min-width:0;overflow:auto;scrollbar-width:none;padding:2px 0}
.scroll::-webkit-scrollbar{display:none}
.pill{border:1px solid #e1e2e5;background:#fff;color:#343434;border-radius:24px;padding:7px 11px;white-space:nowrap;font-size:11px;font-weight:750}
.pill[aria-pressed="true"]{background:#252525;color:white}
.nav{background:white;border:1px solid #dedede;border-radius:9px;padding:6px 10px;font-weight:800}
.results{font-size:11px;color:var(--muted);height:18px;margin-bottom:4px}
.viewport{width:100%;overflow:hidden;touch-action:pan-y}
.rail{display:flex;gap:var(--gap);padding:2px 0 6px;will-change:transform;align-items:stretch}
.card{flex:0 0 268px;width:268px;display:flex;flex-direction:column;background:white;overflow:hidden;border:1px solid var(--line);border-radius:14px}
.cover{height:162px;background:white;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-bottom:1px solid #f1f2f4}
.cover img{max-width:92%;max-height:88%;width:auto;height:auto;object-fit:contain}
.fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:white}
.fallback svg{width:55px;height:55px;opacity:.45}
.flag{position:absolute;top:6px;right:6px;font-weight:850;font-size:10px;color:white;background:#222;padding:4px 8px;border-radius:7px}
.flag.discount{background:#16763c}
.content{display:flex;flex-direction:column;flex:1;gap:5px;padding:9px 10px 10px;min-height:176px}
.store{font-size:11px;font-weight:850;color:#56606d}
.name{font-size:13px;font-weight:850;line-height:1.25;min-height:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:18px;font-weight:950}
.old{font-size:10px;color:#777;text-decoration:line-through;margin-left:5px}
.desc{font-size:10px;color:#66717b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coupon{align-self:flex-start;background:#fff2bc;border:1px dashed #c9a42a;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:800}
.actions{margin-top:auto;display:flex;gap:6px;padding-top:5px}
.action{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:35px;border:0;border-radius:9px;padding:7px 6px;font-size:11px;font-weight:850;text-decoration:none}
.go{background:var(--yellow);color:#141414}
.share{background:#ecf8ef;color:#176538;border:1px solid #c9e8ce}
.off{background:#eee;color:#666}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #ededed;margin-top:4px;padding-top:7px}
.stamp{font-size:10px;color:#727783}
.controls{display:flex;gap:6px}
.ctrl{background:white;border:1px solid #ddd;color:#333;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:800}
@media(max-width:580px){.shell{padding:7px 5px 3px}h2{font-size:18px}.card{flex-basis:250px;width:250px}.cover{height:164px}.bottom{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="shell">
<header class="head">
<div>
<h2>Achadinhos das <mark>Lojas Queridinhas</mark> do Brasil</h2>
<p class="sub">Produtos, promoções e cupons publicados pelas lojas.</p>
</div>
</header>
<div class="filters">
<button class="nav" id="brandPrev" aria-label="Marcas anteriores">‹</button>
<nav class="scroll" id="brands" aria-label="Selecionar loja"></nav>
<button class="nav" id="brandNext" aria-label="Mais marcas">›</button>
</div>
<div class="results" id="status">Consultando ofertas...</div>
<section class="viewport" id="viewport">
<div class="rail" id="rail"></div>
</section>
<div class="bottom">
<span class="stamp" id="stamp">Preços e disponibilidade sujeitos à confirmação nas lojas.</span>
<div class="controls">
<button class="ctrl" id="prev">‹</button>
<button class="ctrl" id="pause">Pausar</button>
<button class="ctrl" id="next">›</button>
</div>
</div>
</main>
<script>
(()=>{
'use strict';
const SOURCE='https://raw.githubusercontent.com/solgarimpa/sol-garimpa-afiliados/main/docs/rakuten/ofertas.json';
const REFRESH=300000,AUTO=4700;
const DOMAINS={
'ASUS BR':'asus.com',
'Cruzeiro Store':'cruzeiro.com.br',
'Insider Store BR':'insiderstore.com.br',
'Inter Store':'inter.co',
'Keeta BR':'keeta.com.br',
'Leroy Merlin BR':'leroymerlin.com.br',
'Movida BR':'movida.com.br',
'Netshoes WL':'netshoes.com.br'
};
const ICONS={'ASUS BR':'asus','Lenovo':'lenovo','Adidas':'adidas'};
const $=id=>document.getElementById(id);
const rail=$('rail'),brands=$('brands'),viewport=$('viewport');
const node=(tag,cls='',text)=>{
const e=document.createElement(tag);
if(cls)e.className=cls;
if(text!==undefined)e.textContent=String(text);
return e;
};
const safe=value=>{
try{
const u=new URL(String(value||''));
return u.protocol==='https:'&&!u.username&&!u.password?u.href:'';
}catch{return '';}
};
const money=(v,c='BRL')=>{
try{
return new Intl.NumberFormat('pt-BR',{
style:'currency',currency:c||'BRL'
}).format(Number(v));
}catch{return 'R$ '+Number(v).toFixed(2);}
};
let all=[],visible=[],partners=new Map();
let selected='Todas',cursor=0,paused=false,busy=false,animating=false,updated='';
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="#5d6570" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M2 8 4 3h16l2 5M9 20v-7h6v7"/></svg>';
function fallback(cover,p){
const wrap=node('div','fallback');
wrap.innerHTML=icon;
cover.append(wrap);
const slug=ICONS[p.loja];
if(slug){
const v=node('img');
v.alt='Logomarca '+p.loja;
v.onload=()=>{
if(v.naturalWidth>0&&wrap.isConnected)wrap.replaceChildren(v);
};
v.src='https://cdn.simpleicons.org/'+slug;
}
}
function validate(url,w,h){
return new Promise(resolve=>{
if(!safe(url))return resolve(false);
const img=new Image();
img.onload=()=>{
const svg=/\.svg(?:[?#]|$)/i.test(url);
resolve(svg||
(img.naturalWidth>=w&&img.naturalHeight>=h));
};
img.onerror=()=>resolve(false);
img.src=url;
});
}
function attachCover(cover,p){
const meta=partners.get(String(p.mid))||{};
const domain=p.dominio_loja||meta.dominio_loja||DOMAINS[p.loja]||'';
const urls=[];
if(p.tipo!=='sem_oferta'&&safe(p.imagem)){
urls.push({url:p.imagem,w:145,h:110,product:true});
}
if(safe(p.logo_url||meta.logo_url)){
urls.push({url:p.logo_url||meta.logo_url,w:180,h:45});
}
if(/^[a-z0-9.-]+$/i.test(domain)&&domain){
urls.push({
url:'https://www.google.com/s2/favicons?domain='+encodeURIComponent(domain)+'&sz=256',
w:100,h:100
});
}
const slug=ICONS[p.loja];
if(slug)urls.push({
url:'https://cdn.simpleicons.org/'+slug,w:1,h:1
});
(async()=>{
for(const item of urls){
if(!cover.isConnected)return;
if(await validate(item.url,item.w,item.h)){
if(!cover.isConnected)return;
const img=node('img');
img.src=item.url;
img.alt=item.product?p.titulo:'Logomarca '+p.loja;
cover.append(img);
return;
}
}
if(cover.isConnected)fallback(cover,p);
})();
}
function card(p){
const inactive=p.tipo==='sem_oferta'||!safe(p.link);
const box=node('article','card');
const cover=node('div','cover');
attachCover(cover,p);
if(!inactive){
let label=p.tipo==='cupom'?'Cupom':p.tipo==='produto'?'Produto':'Oferta';
let discount=0;
if(Number(p.preco)>0&&Number(p.preco_anterior)>Number(p.preco)){
discount=Math.round(100*(1-Number(p.preco)/Number(p.preco_anterior)));
}
if(discount>=5)label=discount+'% OFF';
cover.append(node('span','flag'+(discount>=5?' discount':''),label));
}
box.append(cover);
const inner=node('div','content');
inner.append(node('div','store',p.loja),
node('div','name',p.titulo));
if(!inactive&&Number(p.preco)>0){
const price=node('div','price',money(p.preco,p.moeda));
if(Number(p.preco_anterior)>Number(p.preco)){
price.append(node('span','old',money(p.preco_anterior,p.moeda)));
}
inner.append(price);
}
if(!inactive&&p.cupom)inner.append(node('span','coupon','Cupom: '+p.cupom));
if(!inactive&&p.descricao)inner.append(node('div','desc',p.descricao));
const actions=node('div','actions');
if(inactive){
actions.append(node('span','action off','Sem oferta ativa'));
}else{
const go=node('a','action go','Ver oferta ↗');
go.href=safe(p.link);
go.target='_blank';go.rel='sponsored noopener noreferrer';
const share=node('a','action share','WhatsApp');
share.href='https://wa.me/?text='+encodeURIComponent([
'🛍️ ACHADINHO SOL GARIMPA',p.loja,p.titulo,
Number(p.preco)>0?'💰 '+money(p.preco,p.moeda):'',
p.cupom?'🎟️ Cupom: '+p.cupom:'',
'👉 '+p.link
].filter(Boolean).join('\n'));
share.target='_blank';share.rel='noopener noreferrer';
actions.append(go,share);
}
inner.append(actions);
box.append(inner);
return box;
}
function step(){
const card=rail.querySelector('.card');
return (card?card.getBoundingClientRect().width:268)+12;
}
function paint(){
rail.replaceChildren();
if(!visible.length){
rail.append(node('div','content','Nenhuma oferta disponível.'));
return;
}
const n=visible.length;
const amount=Math.min(8,n);
for(let offset=-1;offset<amount;offset++){
rail.append(card(visible[(cursor+offset+n)%n]));
}
rail.style.transition='none';
rail.style.transform='translate3d('+(-step())+'px,0,0)';
}
function rotate(dir){
if(animating||visible.length<2)return;
animating=true;
const amount=step();
rail.style.transition='transform .45s ease';
rail.style.transform='translate3d('+(-(dir>0?2:0)*amount)+'px,0,0)';
setTimeout(()=>{
cursor=(cursor+dir+visible.length)%visible.length;
paint();
animating=false;
},490);
}
function display(){
visible=all.filter(p=>selected==='Todas'?
p.tipo!=='sem_oferta':p.loja===selected);
cursor=0;
paint();
$('status').textContent=
visible.filter(p=>p.tipo!=='sem_oferta').length+
' ofertas encontradas • '+
new Set(visible.filter(p=>p.tipo!=='sem_oferta').map(p=>p.loja)).size+
' lojas com ofertas disponíveis';
}
function showFilters(){
brands.replaceChildren();
for(const name of ['Todas',...new Set(all.map(p=>p.loja))]){
const button=node('button','pill',name);
button.setAttribute('aria-pressed',String(name===selected));
button.onclick=()=>{
selected=name;showFilters();display();
};
brands.append(button);
}
}
$('brandPrev').onclick=()=>brands.scrollBy({left:-220,behavior:'smooth'});
$('brandNext').onclick=()=>brands.scrollBy({left:220,behavior:'smooth'});
$('prev').onclick=()=>rotate(-1);
$('next').onclick=()=>rotate(1);
$('pause').onclick=()=>{
paused=!paused;
$('pause').textContent=paused?'Continuar':'Pausar';
};
let touchX=null;
viewport.addEventListener('touchstart',e=>{
if(e.touches.length===1)touchX=e.touches[0].clientX;
},{passive:true});
viewport.addEventListener('touchend',e=>{
if(touchX===null)return;
const diff=e.changedTouches[0].clientX-touchX;
touchX=null;
if(Math.abs(diff)>38)rotate(diff<0?1:-1);
},{passive:true});
setInterval(()=>{
if(!paused&&!document.hidden&&!viewport.matches(':hover'))rotate(1);
},AUTO);
async function refresh(){
if(busy)return;
busy=true;
try{
const response=await fetch(SOURCE+'?v='+Date.now(),{cache:'no-store'});
if(!response.ok)throw Error('HTTP '+response.status);
const data=await response.json();
if(!Array.isArray(data.cards)||!Array.isArray(data.parceiros)){
throw Error('Catálogo inválido');
}
const date=Date.parse(data.atualizado_em);
if(!Number.isFinite(date)||Date.now()-date>48*3600000){
throw Error('Catálogo desatualizado');
}
if(updated===data.atualizado_em)return;
updated=data.atualizado_em;
partners=new Map(data.parceiros.map(p=>[String(p.mid),p]));
const known=new Map(data.parceiros.map(p=>[String(p.mid),p.loja]));
all=data.cards
.filter(p=>p&&['produto','promocao','cupom'].includes(p.tipo)&&safe(p.link))
.map(p=>({...p,loja:known.get(String(p.mid))||p.loja}));
for(const partner of data.parceiros){
if(!all.some(p=>p.loja===partner.loja)){
all.push({
loja:partner.loja,mid:partner.mid,
tipo:'sem_oferta',titulo:'Nenhuma oferta vigente encontrada'
});
}
}
showFilters();
display();
$('stamp').textContent='Atualizado em '+
new Date(date).toLocaleString('pt-BR',{
timeZone:'America/Sao_Paulo'
})+' • Preços sujeitos à confirmação • Links de afiliado';
}catch(e){
$('status').textContent='Não foi possível atualizar as ofertas.';
console.warn('Rakuten:',e.message);
}finally{busy=false;}
}
refresh();
setInterval(refresh,REFRESH);
})();
</script>
</body>
</html>
